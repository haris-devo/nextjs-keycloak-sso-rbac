# infra/docker-compose.prod.yml
# This is a separate deployment, not an override of the local Compose file.
name: sso-rbac-prod
services:
  postgres:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [database]
  keycloak:
    build:
      context: ..
      dockerfile: infra/keycloak.Dockerfile
    command: [start, --optimized, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?Required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Required}
      KC_HOSTNAME: https://${AUTH_DOMAIN:?Required}
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      WEB_ORIGIN: https://${WEB_DOMAIN:?Required}
      AUTH_KEYCLOAK_SECRET: ${AUTH_KEYCLOAK_SECRET:?Required}
    volumes:
      - ./realm/realm-export.json:/opt/keycloak/data/import/demo-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, bash, -ec, "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped
    networks: [database, application]
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET:?Required}
      AUTH_URL: https://${WEB_DOMAIN:?Required}
      AUTH_KEYCLOAK_ID: web
      AUTH_KEYCLOAK_SECRET: ${AUTH_KEYCLOAK_SECRET:?Required}
      AUTH_KEYCLOAK_ISSUER: https://${AUTH_DOMAIN:?Required}/realms/demo
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks: [application]
  caddy:
    image: caddy:2.11.7-alpine
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?Required}
      AUTH_DOMAIN: ${AUTH_DOMAIN:?Required}
      ACME_EMAIL: ${ACME_EMAIL:?Required}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
      - 127.0.0.1:8443:8443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    networks: [application]
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
networks:
  database:
    internal: true
  application:
