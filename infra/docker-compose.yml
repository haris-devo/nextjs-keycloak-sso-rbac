# infra/docker-compose.yml
name: sso-rbac-dev
services:
  postgres:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate infra/.env with pnpm env:local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: [start-dev, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?Required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Required}
      KC_HOSTNAME: http://localhost:8080
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      WEB_ORIGIN: ${WEB_ORIGIN:?Required}
      AUTH_KEYCLOAK_SECRET: ${AUTH_KEYCLOAK_SECRET:?Required}
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - ./realm/realm-export.json:/opt/keycloak/data/import/demo-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, bash, -ec, "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped
volumes:
  postgres_data:
